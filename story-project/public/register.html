<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Story Project</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Story Project
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main>

        <section class="form-section">

            <div class="form-container">

                <h1>Create Your Account</h1>

                <p>
                    Join Story Project and share your stories.
                </p>


                <form id="register-form">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                    >


                    <button
                        type="submit"
                        class="btn primary"
                    >
                        Create Account
                    </button>

                </form>


                <p id="register-message"></p>


                <p>
                    Already have an account?
                    <a href="login.html">
                        Login here
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
